<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="50%" style="stop-color:#1a1040"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285f4"/>
      <stop offset="100%" style="stop-color:#00c853"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="50" x2="1200" y2="50" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="550" x2="1200" y2="550" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="60" y1="0" x2="60" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="120" y1="0" x2="120" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="180" y1="0" x2="180" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="360" y1="0" x2="360" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="420" y1="0" x2="420" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="540" y1="0" x2="540" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="660" y1="0" x2="660" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="780" y1="0" x2="780" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="840" y1="0" x2="840" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="960" y1="0" x2="960" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="1020" y1="0" x2="1020" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="1080" y1="0" x2="1080" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="1140" y1="0" x2="1140" y2="630" stroke="#fff" stroke-width="0.5"/>
  </g>
  
  <!-- Floating circles -->
  <circle cx="150" cy="120" r="60" fill="#4285f4" opacity="0.1"/>
  <circle cx="1050" cy="500" r="80" fill="#00c853" opacity="0.08"/>
  <circle cx="950" cy="100" r="40" fill="#ff6d00" opacity="0.06"/>
  
  <!-- Docker whale simplified -->
  <g transform="translate(600, 280)" filter="url(#glow)">
    <!-- Whale body -->
    <ellipse cx="0" cy="0" rx="70" ry="50" fill="none" stroke="#4285f4" stroke-width="3"/>
    <!-- Whale tail -->
    <path d="M 70 0 L 120 -30 L 110 0 L 120 30 Z" fill="none" stroke="#4285f4" stroke-width="2"/>
    <!-- Whale eye -->
    <circle cx="-25" cy="-10" r="4" fill="#4285f4"/>
    <!-- Docker box -->
    <rect x="-45" y="-65" width="35" height="25" rx="3" fill="none" stroke="#00c853" stroke-width="2.5"/>
    <line x1="-45" y1="-50" x2="-10" y2="-50" stroke="#00c853" stroke-width="1.5"/>
    <rect x="-45" y="-25" width="35" height="25" rx="3" fill="none" stroke="#00c853" stroke-width="2.5"/>
    <line x1="-45" y1="-10" x2="-10" y2="-10" stroke="#00c853" stroke-width="1.5"/>
    <!-- Cloud lines -->
    <path d="M -90 -15 Q -100 -25 -90 -35" fill="none" stroke="#00c853" stroke-width="2" opacity="0.6"/>
    <path d="M -100 -5 Q -110 -15 -100 -25" fill="none" stroke="#00c853" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- Container boxes on the right -->
  <g transform="translate(900, 200)" filter="url(#glow)" opacity="0.7">
    <rect x="0" y="0" width="50" height="50" rx="5" fill="#4285f4" opacity="0.15" stroke="#4285f4" stroke-width="1.5"/>
    <text x="25" y="30" text-anchor="middle" fill="#4285f4" font-size="18" font-family="monospace">🐳</text>
    
    <rect x="60" y="10" width="50" height="50" rx="5" fill="#00c853" opacity="0.15" stroke="#00c853" stroke-width="1.5"/>
    <text x="85" y="40" text-anchor="middle" fill="#00c853" font-size="16" font-family="monospace">⚡</text>
    
    <rect x="120" y="0" width="50" height="50" rx="5" fill="#ff6d00" opacity="0.15" stroke="#ff6d00" stroke-width="1.5"/>
    <text x="145" y="30" text-anchor="middle" fill="#ff6d00" font-size="16" font-family="monospace">🔧</text>
    
    <!-- Connection lines -->
    <line x1="50" y1="25" x2="60" y2="35" stroke="#4285f4" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="110" y1="35" x2="120" y2="25" stroke="#00c853" stroke-width="1" stroke-dasharray="4,4"/>
  </g>
  
  <!-- Title -->
  <text x="150" y="260" fill="white" font-size="48" font-weight="bold" font-family="system-ui, sans-serif">Docker Compose</text>
  <text x="150" y="320" fill="url(#accent)" font-size="36" font-family="system-ui, sans-serif" filter="url(#glow)">Hermes Agent + Web UI</text>
  
  <!-- Subtitle -->
  <text x="150" y="380" fill="#8892b0" font-size="18" font-family="system-ui, sans-serif">一站式部署 AIOps Agent 框架</text>
  
  <!-- Tech tags -->
  <g transform="translate(150, 410)">
    <rect x="0" y="0" width="90" height="28" rx="14" fill="#4285f4" opacity="0.15" stroke="#4285f4" stroke-width="1"/>
    <text x="45" y="19" text-anchor="middle" fill="#4285f4" font-size="12" font-family="monospace">Docker</text>
    
    <rect x="100" y="0" width="105" height="28" rx="14" fill="#00c853" opacity="0.15" stroke="#00c853" stroke-width="1"/>
    <text x="152" y="19" text-anchor="middle" fill="#00c853" font-size="12" font-family="monospace">Hermes Agent</text>
    
    <rect x="215" y="0" width="110" height="28" rx="14" fill="#ff6d00" opacity="0.15" stroke="#ff6d00" stroke-width="1"/>
    <text x="270" y="19" text-anchor="middle" fill="#ff6d00" font-size="12" font-family="monospace">Web Dashboard</text>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="150" y1="460" x2="450" y2="460" stroke="url(#accent)" stroke-width="3" opacity="0.5"/>
  
  <!-- Bottom right: compose icon -->
  <g transform="translate(1050, 520)" opacity="0.6">
    <text x="0" y="0" fill="#8892b0" font-size="13" font-family="monospace">compose</text>
    <text x="70" y="0" fill="#00c853" font-size="13" font-family="monospace">up -d</text>
  </g>
</svg>
